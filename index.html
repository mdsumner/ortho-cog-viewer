<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ortho COG Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        z-index: 100;
        max-width: 420px;
        border-radius: 4px;
      }
      #controls input[type="text"] {
        width: 280px;
        padding: 4px;
        font-family: monospace;
        font-size: 11px;
        margin: 5px 0;
      }
      #controls input.small {
        width: 50px;
      }
      #controls input.crs {
        width: 120px;
      }
      #controls input.extent {
        width: 280px;
      }
      #vertex-count {
        color: #aaa;
        font-size: 10px;
      }
      #controls button {
        padding: 4px 8px;
        cursor: pointer;
        font-family: monospace;
      }
      #controls label {
        display: inline-block;
        width: 45px;
        text-align: right;
        margin-right: 4px;
      }
      .control-row {
        margin: 4px 0;
      }
      #info {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
      }
      #layers {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
        max-height: 150px;
        overflow-y: auto;
      }
      .layer-item {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 0;
        font-size: 10px;
      }
      .layer-item button {
        padding: 1px 4px;
        font-size: 10px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title-row a {
        color: #9cf;
        font-size: 10px;
      }
      .title-row button {
        margin-left: auto;
      }
      #controls.collapsed fieldset,
      #controls.collapsed #info {
        display: none;
      }
      #controls select {
        font-family: monospace;
        font-size: 11px;
        padding: 3px;
        max-width: 280px;
      }
      #controls input.small {
        width: 60px;
      }
      #controls label.wide {
        width: auto;
        text-align: left;
      }
      .hint {
        color: #aaa;
        font-size: 10px;
      }
      .crs-string {
        display: inline-block;
        max-width: 380px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #info {
        user-select: text;
      }
      fieldset {
        border: 1px solid #444;
        padding: 6px;
        margin: 6px 0;
      }
      legend {
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div class="title-row">
        <strong>Ortho COG Viewer</strong>
        <a href="https://github.com/mdsumner/ortho-cog-viewer" target="_blank" rel="noopener">source</a>
        <button id="panel-toggle" title="Collapse/expand panel">_</button>
      </div>
      
      <fieldset>
        <legend>Display</legend>
        <div class="control-row">
          <label>Mode:</label>
          <select id="mode">
            <option value="fixed">fixed extent</option>
            <option value="centred">centred projection</option>
          </select>
        </div>
        <div id="fixed-panel">
          <div class="control-row">
            <label>CRS:</label>
            <input type="text" id="display-crs" class="crs" value="EPSG:3857" />
          </div>
          <div class="control-row">
            <label>Extent:</label>
            <input type="text" id="extent" class="extent" value="-40000000,40000000,-40000000,40000000" />
          </div>
        </div>
        <div id="centred-panel" hidden>
          <div class="control-row">
            <label>Proj:</label>
            <select id="proj"></select>
          </div>
          <div class="control-row">
            <label></label>
            <input type="text" id="proj-template" class="extent" hidden
                   placeholder="+proj=... +lon_0={lon_0} +lat_0={lat_0} +x_0=0 +y_0=0 +ellps=WGS84 +units=m" />
          </div>
          <div class="control-row">
            <label>Centre:</label>
            <input type="text" id="centre-lon" class="small" value="0" title="longitude" />
            <input type="text" id="centre-lat" class="small" value="-90" title="latitude" />
            <span class="hint">lon, lat (drag the map to move it)</span>
          </div>
        </div>
        <div class="control-row">
          <label>Grid:</label>
          <input type="number" id="grid-size" class="small" value="64" min="4" max="256" />
          <span id="vertex-count">(4225 verts)</span>
          <button id="apply-crs-btn">Apply</button>
        </div>
        <div class="control-row">
          <label></label>
          <input type="checkbox" id="graticule" checked />
          <label for="graticule" class="wide">graticule</label>
          <input type="checkbox" id="wireframe" />
          <label for="wireframe" class="wide">show triangles</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Layers</legend>
        <input type="text" id="cog-url" placeholder="Enter COG URL..." />
        <button id="load-btn">Load</button>
        <button id="add-btn">Add</button>
        <div id="layers"></div>
      </fieldset>
      
      <div id="info"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
