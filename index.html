<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ortho COG Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        z-index: 100;
        max-width: 400px;
        border-radius: 4px;
      }
      #controls input[type="text"] {
        width: 280px;
        padding: 4px;
        font-family: monospace;
        font-size: 11px;
        margin: 5px 0;
      }
      #controls button {
        padding: 4px 8px;
        cursor: pointer;
        font-family: monospace;
      }
      #info {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
      }
      #layers {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #444;
        max-height: 150px;
        overflow-y: auto;
      }
      .layer-item {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 0;
        font-size: 10px;
      }
      .layer-item button {
        padding: 1px 4px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <strong>Ortho COG Viewer</strong><br>
      <input type="text" id="cog-url" placeholder="Enter COG URL..." />
      <button id="load-btn">Load</button>
      <button id="add-btn">Add Layer</button>
      <div id="layers"></div>
      <div id="info"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
